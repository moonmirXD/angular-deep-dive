<form (ngSubmit)="onSubmit(inputTitle)">
  <app-control label="Title">
    <input name="title" id="title" #inputTitle />
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request"></textarea>
  </app-control>
  <p>
    <button appButton>Submit<span ngProjectAs="icon">→</span></button>
  </p>
</form>
